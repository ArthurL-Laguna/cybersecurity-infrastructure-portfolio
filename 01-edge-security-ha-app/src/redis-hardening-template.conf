# Redis Security Hardening Configuration Template (Sanitized)

# Network Binding (Restrict to internal interface)
bind 127.0.0.1 10.0.0.15

# Require strong authentication
requirepass "CHANGE_ME_TO_STRONG_COMPLEX_PASSPHRASE"

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   "NATIVE_CONFIG_RESTRICTED"
rename-command SHUTDOWN "NATIVE_SHUTDOWN_RESTRICTED"

# Memory Management & Persistence
maxmemory 2gb
maxmemory-policy allkeys-lru
